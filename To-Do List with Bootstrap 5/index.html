<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      :root {
        --penguin-blue: #e3f2fd;
        --ice-white: #ffffff;
        --ocean-blue: #0077b6;
        --beak-yellow: #ffb703;
      }

      body {
        background-color: var(--penguin-blue);
        background-image:
          radial-gradient(at 0% 0%, hsla(197, 100%, 82%, 1) 0, transparent 50%),
          radial-gradient(
            at 100% 100%,
            hsla(190, 100%, 91%, 1) 0,
            transparent 50%
          );
        color: #2d3436;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        padding: 50px 0;
      }

      .todo-container {
        max-width: 850px;
        margin: auto;
        position: relative;
      }

      .todo-container::before {
        content: "🐧";
        font-size: 3rem;
        position: absolute;
        top: -50px;
        left: 10px;
      }

      .glass-card {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(15px);
        border: 4px solid var(--ice-white);
        border-radius: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        padding: 40px;
      }

      .form-control,
      .form-select {
        border-radius: 12px;
        border: 2px solid #dee2e6;
        padding: 12px;
      }

      .form-control:focus {
        border-color: var(--ocean-blue);
        box-shadow: 0 0 0 0.25rem rgba(0, 119, 182, 0.25);
      }

      .btn-penguin {
        background: var(--beak-yellow);
        color: #333;
        font-weight: bold;
        border: none;
        border-radius: 12px;
        transition: transform 0.2s;
      }

      .btn-penguin:hover {
        background: #ffa000;
        transform: translateY(-2px);
      }

      .task-item {
        background: white;
        border: 2px solid #f1f3f5;
        border-radius: 15px;
        margin-bottom: 12px;
        padding: 20px;
        transition: all 0.3s;
      }

      .task-item:hover {
        border-color: var(--ocean-blue);
        transform: scale(1.01);
      }

      /* Badge Colors */
      .badge-high {
        background-color: #ffcccc;
        color: #cc0000;
        border-radius: 8px;
      }
      .badge-medium {
        background-color: #fff4cc;
        color: #856404;
        border-radius: 8px;
      }
      .badge-low {
        background-color: #d4edda;
        color: #155724;
        border-radius: 8px;
      }

      .filter-group .btn {
        border-radius: 10px;
        margin-left: 5px;
        border: 1px solid #ddd;
      }

      .filter-group .btn.active {
        background-color: var(--ocean-blue);
        color: white;
        border-color: var(--ocean-blue);
      }

      .text-time {
        color: #888;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="container todo-container">
      <div class="mb-4 d-flex justify-content-between align-items-center">
        <span
          class="badge bg-white text-dark shadow-sm p-2 px-3 rounded-pill border"
        >
          Bootstrap To-Do
        </span>
      </div>

      <div class="row align-items-center mb-5">
        <div class="col-md-7">
          <h1 class="display-5 fw-bold text-dark">
            Your Tasks,
            <span style="color: var(--ocean-blue)">beautifully organized</span>
          </h1>
          <p class="text-muted">
            เพิ่มรายการ จัดการงาน และให้เพนกวินช่วยดูแลตารางเวลาของคุณ
          </p>
        </div>
        <div class="col-md-5 text-end">
          <span class="badge bg-light text-muted border me-2"
            >❄️  total •  active</span
          >
        </div>
      </div>

      <div class="glass-card">
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <input
              type="text"
              class="form-control shadow-sm"
              placeholder="เพิ่มงานใหม่ที่นี่... (Enter)"
            />
          </div>
          <div class="col-md-3">
            <select class="form-select shadow-sm">
              <option>ระดับความสำคัญ</option>
              <option>High 🔴</option>
              <option>Medium 🟡</option>
              <option>Low 🟢</option>
            </select>
          </div>
          <div class="col-md-3">
            <button class="btn btn-penguin w-100 h-100 py-2 shadow-sm">
              + Add Task
            </button>
          </div>
        </div>

        <div
          class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3"
        >
          <div class="position-relative w-50">
            <i
              class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"
            ></i>
            <input
              type="text"
              class="form-control ps-5 border-0 bg-light"
              placeholder="ค้นหางานของคุณ..."
            />
          </div>
          <div class="filter-group d-flex">
            <button class="btn btn-sm active">All</button>
            <button class="btn btn-sm">Active</button>
            <button class="btn btn-sm">Completed</button>
          </div>
        </div>

        <div class="task-list">
          <div
            class="task-item d-flex align-items-center justify-content-between shadow-sm"
          >
            <div class="d-flex align-items-center">
              <div class="me-3 fs-4 text-muted">
                <i class="bi bi-circle"></i>
              </div>
              <div>
                <div class="fw-bold fs-5">
                  เขียนโค้ด CSS
                  <span class="badge badge-medium ms-2">Medium</span>
                </div>
                <div class="text-time">
                  <i class="bi bi-calendar3"></i> 3 Feb 2026, 10:30 AM
                </div>
              </div>
            </div>
            <div>
              <button class="btn btn-light rounded-circle me-1">
               <i class="fa-solid fa-wrench"></i>
              </button>
              <button class="btn btn-light rounded-circle text-danger">
                <i class="fa-solid fa-dumpster"></i>
              </button>
            </div>
          </div>

          <div
            class="task-item d-flex align-items-center justify-content-between shadow-sm"
          >
            <div class="d-flex align-items-center">
              <div class="me-3 fs-4 text-info">
                <i class="bi bi-check-circle-fill"></i>
              </div>
              <div>
                <div
                  class="fw-bold fs-5 text-muted text-decoration-line-through"
                >
                  ส่งรายงานแล็บ <span class="badge badge-high ms-2">High</span>
                </div>
                <div class="text-time opacity-50">
                  <i class="bi bi-calendar3"></i> 2 Feb 2026, 04:15 PM
                </div>
              </div>
            </div>
            <div>
              <button class="btn btn-light rounded-circle me-1">
               <i class="fa-solid fa-wrench"></i>
              </button>
              <button class="btn btn-light rounded-circle text-danger">
                <i class="fa-solid fa-dumpster"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-5 text-muted small">
        Built with 🐧 Penguin Power & Bootstrap 5 • Saved in your igloo
        (localStorage)
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
